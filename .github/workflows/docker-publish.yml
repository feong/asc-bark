name: Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/feong/asc-bark
  # One manifest list. docker pull selects the image for the machine.
  PLATFORMS: linux/amd64,linux/arm64/v8

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  image:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # latest tracks main. A version tag is published under its own name.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build image for both platforms
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          outputs: type=oci,dest=/tmp/asc-bark-image.tar
          provenance: false

      - name: Verify both platforms
        if: github.event_name == 'pull_request'
        run: |
          python3 - << 'PY'
          import json
          import os
          import sys
          import tarfile

          path = "/tmp/asc-bark-image.tar"

          class Layout:
              def __init__(self, root):
                  self.root = root
                  self.archive = None

              def read_json(self, name):
                  if self.archive is None:
                      with open(os.path.join(self.root, name), encoding="utf-8") as handle:
                          return json.load(handle)
                  member = self.archive.extractfile(self._member(name))
                  return json.load(member)

              def _member(self, name):
                  wanted = name.lstrip("./")
                  matches = [
                      item
                      for item in self.archive.getnames()
                      if item.lstrip("./") == wanted
                  ]
                  if not matches:
                      raise FileNotFoundError(name)
                  return min(matches, key=len)

          layout = Layout(path)
          if not os.path.isdir(path):
              layout.archive = tarfile.open(path)

          def platforms_in(document, seen):
              found = []
              for item in document.get("manifests") or []:
                  platform = item.get("platform") or {}
                  os_name = platform.get("os") or ""
                  architecture = platform.get("architecture") or ""
                  if os_name not in ("", "unknown") and architecture not in ("", "unknown"):
                      found.append(
                          {
                              "os": os_name,
                              "architecture": architecture,
                              "variant": platform.get("variant") or "",
                          }
                      )
                  media_type = item.get("mediaType") or ""
                  digest = item.get("digest") or ""
                  nested = "index" in media_type or "list" in media_type
                  if digest and nested and digest not in seen:
                      seen.add(digest)
                      algo, digest_hex = digest.split(":", 1)
                      found.extend(
                          platforms_in(
                              layout.read_json(f"blobs/{algo}/{digest_hex}"),
                              seen,
                          )
                      )
              return found

          found = platforms_in(layout.read_json("index.json"), set())
          if layout.archive is not None:
              layout.archive.close()

          def normalize(item):
              # Buildx omits the default arm64 variant. An empty variant is v8.
              variant = item["variant"]
              if item["architecture"] == "arm64" and variant in ("", "v8"):
                  variant = "v8"
              return {
                  "os": item["os"],
                  "architecture": item["architecture"],
                  "variant": variant,
              }

          found = [normalize(item) for item in found]
          print(json.dumps(found, indent=2))
          required = [
              {"os": "linux", "architecture": "amd64", "variant": ""},
              {"os": "linux", "architecture": "arm64", "variant": "v8"},
          ]
          missing = [item for item in required if item not in found]
          if missing:
              print("missing platforms:", json.dumps(missing), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # GITHUB_TOKEN cannot change package visibility. The Packages API
      # does not enable that operation for GitHub Actions. Confirm the tag
      # can be pulled without credentials and contains both platforms.
      - name: Check the published tag is public
        if: github.event_name == 'push' && github.event.repository.visibility == 'public'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          python3 - << 'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          tags = [line.strip() for line in os.environ["TAGS"].splitlines() if line.strip()]
          if not tags:
              print("no tags were published", file=sys.stderr)
              sys.exit(1)

          def normalize(item):
              # Buildx omits the default arm64 variant. An empty variant is v8.
              variant = item["variant"]
              if item["architecture"] == "arm64" and variant in ("", "v8"):
                  variant = "v8"
              return {
                  "os": item["os"],
                  "architecture": item["architecture"],
                  "variant": variant,
              }

          required = [
              {"os": "linux", "architecture": "amd64", "variant": ""},
              {"os": "linux", "architecture": "arm64", "variant": "v8"},
          ]

          def request(url, headers):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read()

          def platforms_for(tag):
              host, rest = tag.split("/", 1)
              name, version = rest.rsplit(":", 1)
              scope = urllib.parse.quote(f"repository:{name}:pull", safe="")
              token = json.loads(
                  request(f"https://{host}/token?service={host}&scope={scope}", {})
              )["token"]
              body = request(
                  f"https://{host}/v2/{name}/manifests/{version}",
                  {
                      "Authorization": f"Bearer {token}",
                      "Accept": ", ".join(
                          [
                              "application/vnd.oci.image.index.v1+json",
                              "application/vnd.docker.distribution.manifest.list.v2+json",
                          ]
                      ),
                  },
              )
              found = []
              for item in json.loads(body).get("manifests") or []:
                  platform = item.get("platform") or {}
                  os_name = platform.get("os") or ""
                  architecture = platform.get("architecture") or ""
                  if os_name in ("", "unknown") or architecture in ("", "unknown"):
                      continue
                  found.append(
                      normalize(
                          {
                              "os": os_name,
                              "architecture": architecture,
                              "variant": platform.get("variant") or "",
                          }
                      )
                  )
              return name, found

          for tag in tags:
              name = tag.split("/", 1)[1].rsplit(":", 1)[0]
              for attempt in range(1, 7):
                  try:
                      _name, found = platforms_for(tag)
                      missing = [item for item in required if item not in found]
                      print(json.dumps(found, indent=2))
                      if missing:
                          print("missing platforms:", json.dumps(missing), file=sys.stderr)
                          sys.exit(1)
                      print(tag, "is public")
                      break
                  except urllib.error.HTTPError as exc:
                      print(
                          f"{tag} is not anonymously pullable yet (attempt {attempt}): HTTP {exc.code}",
                          file=sys.stderr,
                      )
                      if attempt == 6:
                          owner, package = name.split("/", 1)
                          print(
                              "Set the package public once at "
                              f"https://github.com/users/{owner}/packages/container/package/{package}/settings",
                              file=sys.stderr,
                          )
                          sys.exit(1)
                      time.sleep(5)
                  except urllib.error.URLError as exc:
                      print(
                          f"{tag} could not be fetched (attempt {attempt}): {exc.reason}",
                          file=sys.stderr,
                      )
                      if attempt == 6:
                          sys.exit(1)
                      time.sleep(5)
          PY
